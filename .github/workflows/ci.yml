name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend-tests:
    name: Backend tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # No Docker/MariaDB needed here: tests/Integration/BloomWebApplicationFactory.cs swaps
      # BloomDbContext to an in-memory SQLite database, so the full unit + integration suite
      # runs standalone against the .NET SDK alone.
      - name: Test
        run: dotnet test tests/bloom.Tests.csproj --configuration Release

  frontend-tests:
    name: Frontend tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
