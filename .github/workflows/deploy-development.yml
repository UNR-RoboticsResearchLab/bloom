name: Deploy development

# Deploys every push to development to the server described in docs/deploy-docker.md, once the tests
# pass. Three stages:
#   tests   ci.yml
#   image   builds the Docker image on a GitHub runner (layer cache kept between runs) and pushes it to
#           ghcr.io/<owner>/bloom-server:<commit>, so the server never builds anything
#   deploy  joins your Tailscale tailnet, SSHes to the server over it (no public SSH port needed), and
#           runs deploy-docker.sh, which pulls that image and restarts the stack
#
# Needs, in the "development" environment (Settings -> Environments):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   Tailscale OAuth client (scope: auth_keys write, tag:ci)
#   DEPLOY_HOST                           the server's tailnet name or 100.x address
#   DEPLOY_USER, DEPLOY_PATH              deploy user, and the repo checkout on the server
#   DEPLOY_SSH_KEY                        private key of a deploy-only key pair (no passphrase)
#   DEPLOY_KNOWN_HOSTS                    ssh-keyscan -t ed25519 <server>, run from the tailnet (the host name in it doesn't matter)
# Optional repository variable (Settings -> Variables):
#   DEPLOY_ARCH                           "arm64" if the server is arm64 (builds natively on an arm runner);
#                                         unset for x86-64
# The tailnet policy must let tag:ci reach the server on port 22.
on:
  push:
    branches: [development]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a deploy half way.
concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  image:
    name: Build image
    needs: tests
    # Build on the server's own architecture, so nothing is emulated.
    runs-on: ${{ vars.DEPLOY_ARCH == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    outputs:
      image: ${{ steps.ref.outputs.image }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nbgv needs the full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The Docker build has no .git, so the version is computed here and passed in.
      - name: Version
        id: version
        run: |
          dotnet tool install -g nbgv
          echo "semver=$("$HOME/.dotnet/tools/nbgv" get-version -v SemVer2)" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bloom-server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: BUILD_VERSION=${{ steps.version.outputs.semver }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
          # npm install and dotnet restore are cached until package.json / the csproj change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to development server
    needs: image
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read   # the token handed to the server for the pull
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BLOOM_IMAGE: ${{ needs.image.outputs.image }}
          BUILD_VERSION: ${{ needs.image.outputs.semver }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set in the 'development' environment"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pin the server's ed25519 key under the exact name used to connect. DEPLOY_KNOWN_HOSTS may be the
          # whole `ssh-keyscan` line or just "ssh-ed25519 AAAA...": the host name inside it (an IP, a short
          # name, a MagicDNS name) is ignored, so it can't fail to match DEPLOY_HOST.
          host_key="$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | grep -vE '^[[:space:]]*#' \
            | sed -nE 's/.*(^|[[:space:]])(ssh-ed25519[[:space:]]+[A-Za-z0-9+\/=]+).*/\2/p' | head -n1)"
          if [ -z "$host_key" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no ssh-ed25519 key. Run 'ssh-keyscan -t ed25519 <server>' from a tailnet machine and paste its output."
            exit 1
          fi
          printf '%s %s\n' "$DEPLOY_HOST" "$host_key" > ~/.ssh/known_hosts
          # The host key is pinned (no trust-on-first-use): a changed key fails the deploy.
          # Fetch and check out first, then run the script from the new checkout.
          # The registry token goes to the script on stdin, never on a command line. The server logs in with
          # it, pulls the image, and logs out; it is only valid for this job anyway.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $(printf %q "$DEPLOY_PATH") && git fetch --prune origin && git checkout --force --detach $(printf %q "$GITHUB_SHA") && BLOOM_IMAGE=$(printf %q "$BLOOM_IMAGE") BLOOM_REGISTRY_USER=$(printf %q "$REGISTRY_USER") BUILD_VERSION=$(printf %q "$BUILD_VERSION") ./deploy-docker.sh"
