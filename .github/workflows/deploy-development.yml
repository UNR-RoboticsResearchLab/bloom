name: Deploy development

# Deploys every push to development to the server described in docs/deploy-docker.md, once the tests
# pass. The runner joins your Tailscale tailnet, then SSHes to the server over it, so the server
# needs no public SSH port. It runs deploy-docker.sh (the production-mode stack) and then
# deploy-dev-stack.sh (the hot-reload development stack from docker-compose.yml).
#
# Needs, in the "development" environment (Settings -> Environments):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   Tailscale OAuth client (scope: auth_keys write, tag:ci)
#   DEPLOY_HOST                           the server's tailnet name or 100.x address
#   DEPLOY_USER, DEPLOY_PATH              deploy user, and the repo checkout on the server
#   DEPLOY_SSH_KEY                        private key of a deploy-only key pair (no passphrase)
#   DEPLOY_KNOWN_HOSTS                    ssh-keyscan -t ed25519 <server>, run from the tailnet (the host name in it doesn't matter)
# Optional repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   DEPLOY_DEV_STACK                      "false" to skip the development stack (default: deploy it)
# The tailnet policy must let tag:ci reach the server on port 22.
on:
  push:
    branches: [development]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a deploy half way.
concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to development server
    needs: tests
    runs-on: ubuntu-latest
    environment: development
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The Docker build has no .git, so the version is computed here and passed in.
      - name: Version
        id: version
        run: |
          dotnet tool install -g nbgv
          echo "semver=$("$HOME/.dotnet/tools/nbgv" get-version -v SemVer2)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare SSH
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set in the 'development' environment"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pin the server's ed25519 key under the exact name used to connect. DEPLOY_KNOWN_HOSTS may be the
          # whole `ssh-keyscan` line or just "ssh-ed25519 AAAA...": the host name inside it (an IP, a short
          # name, a MagicDNS name) is ignored, so it can't fail to match DEPLOY_HOST. The key is pinned (no
          # trust-on-first-use): a changed key fails the deploy.
          host_key="$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | grep -vE '^[[:space:]]*#' \
            | sed -nE 's/.*(^|[[:space:]])(ssh-ed25519[[:space:]]+[A-Za-z0-9+\/=]+).*/\2/p' | head -n1)"
          if [ -z "$host_key" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no ssh-ed25519 key. Run 'ssh-keyscan -t ed25519 <server>' from a tailnet machine and paste its output."
            exit 1
          fi
          printf '%s %s\n' "$DEPLOY_HOST" "$host_key" > ~/.ssh/known_hosts

      # Fetch and check out first, then run the script from the new checkout.
      - name: Deploy over SSH
        env:
          BUILD_VERSION: ${{ steps.version.outputs.semver }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $(printf %q "$DEPLOY_PATH") && git fetch --prune origin && git checkout --force --detach $(printf %q "$GITHUB_SHA") && BUILD_VERSION=$(printf %q "$BUILD_VERSION") ./deploy-docker.sh"

      # The hot-reload development stack (docker-compose.yml) next to the stack above. On by default; set the
      # repository variable DEPLOY_DEV_STACK=false to skip it. Needs DEV_BIND in the server's .env.
      - name: Deploy the development stack
        if: ${{ vars.DEPLOY_DEV_STACK != 'false' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $(printf %q "$DEPLOY_PATH") && git fetch --prune origin && git checkout --force --detach $(printf %q "$GITHUB_SHA") && ./deploy-dev-stack.sh" < /dev/null
