name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Generate documentation pages
        run: python -m sphinx -b html -c docs . docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-documentation
          path: docs/_build/html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == (vars.DOCS_PUBLISH_BRANCH || github.event.repository.default_branch)
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages site
        if: github.event_name != 'pull_request' && github.ref_name == (vars.DOCS_PUBLISH_BRANCH || github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Publish documentation
    needs: sphinx
    if: github.event_name != 'pull_request' && github.ref_name == (vars.DOCS_PUBLISH_BRANCH || github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
