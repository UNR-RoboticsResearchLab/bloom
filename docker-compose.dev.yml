
services:
  bloom-react-dev:
    build:
      context: ./ClientApp
      dockerfile: ./Dockerfile.dev
    image: bloom-react-dev:latest
    container_name: bloom-react-dev
    ports:
      - "3000:3000"
    volumes:
      - ./ClientApp:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://bloom-server-dev:8080/
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - NODE_OPTIONS=--max-old-space-size=4096
      - HOST=0.0.0.0
      - PORT=3000
      - HTTPS=false
    networks:
      - bloom-network
  mariadb-dev:
    image: mariadb:latest
    container_name: mariadb-dev
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: bloomrootpassword
      MARIADB_DATABASE: bloomdb
      MARIADB_USER: bloomuser
      MARIADB_PASSWORD: bloompassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bloom-network

  bloom-server-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: bloom-server-dev:latest
    container_name: bloom-server-dev
    ports:
      - "5000:8080"
      - "2443:2443"
    depends_on:
      mariadb-dev:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # - ASPNETCORE_HTTPS_PORT=2443
    restart: always
    volumes:
      - dpkeys:/var/dpkeys
    networks:
      - bloom-network


  arsr-service:
    build:
      context: ../AutoRsr-NoBert-SARG
      dockerfile: Dockerfile
    image: arsr-service:latest
    container_name: arsr-service
    ports:
      - "5050:5050"
    environment:
      - ARSR_PORT=5050
      - ARSR_RECORDINGS_DIR=/data/recordings
    volumes:
      - arsr_recordings:/data/recordings
    networks:
      - bloom-network
    restart: always

networks:
  bloom-network:
    driver: bridge

volumes:
  dpkeys:
  db_data:
  arsr_recordings:

