
services:
  bloom-react-dev:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.dev
    image: bloom-react-dev:latest
    container_name: bloom-react-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src       # Live update for src folder
      - ./frontend/public:/app/public # Live update for public assets
      - /app/node_modules    # Keep container node_modules isolated
    environment:
      # Leave unset: ApiClientContext falls back to the page's own hostname,
      # so the SPA and API stay same-site (SameSite=Lax cookie survives) no
      # matter which machine/IP the browser is pointed at. A hardcoded IP
      # here only works from that one address -- everywhere else, the login
      # cookie gets set for a different site than the page's origin and every
      # authenticated fetch right after sign-in comes back 401.
      # - REACT_APP_API_BASE_URL=http://192.168.1.190:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - NODE_OPTIONS=--max-old-space-size=4096
      - HOST=0.0.0.0
      - PORT=3000
      - HTTPS=false
    networks:
      - bloom-network
  mariadb-dev:
    image: mariadb:latest
    container_name: mariadb-dev
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: bloomrootpassword
      MARIADB_DATABASE: bloomdb
      MARIADB_USER: bloomuser
      MARIADB_PASSWORD: bloompassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bloom-network

  arsr-db-dev:
    image: mariadb:latest
    container_name: arsr-db-dev
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: arsrrootpassword
      MARIADB_DATABASE: arsrdbl
    ports:
      - "3307:3306"
    volumes:
      - arsr_db_data:/var/lib/mysql
    networks:
      - bloom-network

  bloom-server-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: bloom-server-dev:latest
    container_name: bloom-server-dev
    ports:
      - "8080:8080"
      - "2443:2443"
    depends_on:
      mariadb-dev:
        condition: service_started
      arsr-db-dev:
        condition: service_started
    env_file:
      - path: backend/.env   # AZURE_OPENAI_* secrets — gitignored, not committed
        required: false
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # - ASPNETCORE_HTTPS_PORT=2443
    restart: always
    volumes:
      - dpkeys:/var/dpkeys
    networks:
      - bloom-network


  # Superseded by auto_rsr below (old ArSr integration; backend wiring disabled in Program.cs).
  # arsr-service:
  #   build:
  #     context: ../AutoRsr-NoBert-SARG
  #     dockerfile: Dockerfile
  #   image: arsr-service:latest
  #   container_name: arsr-service
  #   ports:
  #     - "5050:5050"
  #   environment:
  #     - ARSR_PORT=5050
  #     - ARSR_RECORDINGS_DIR=/data/recordings
  #   volumes:
  #     - arsr_recordings:/data/recordings
  #   networks:
  #     - bloom-network
  #   restart: always

  auto_rsr:
    build:
      context: ./AutoRSR
    image: auto-rsr:latest
    container_name: auto-rsr
    restart: always
    environment:
      - ARSR_PORT=5050
      - ARSR_RECORDINGS_DIR=/app/uploads/recordings
    # TODO: collides with arsr-service above on host port 5050 - remap one of these.
    ports:
      - "5050:5050"
    volumes:
      - rsr_recordings:/app/uploads/recordings
    networks:
      - bloom-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  bloom-network:
    driver: bridge

volumes:
  dpkeys:
  db_data:
  arsr_db_data:
  arsr_recordings:
  rsr_recordings:
