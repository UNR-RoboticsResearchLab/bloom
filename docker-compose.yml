## Builds Database container and ASP.NET Core container for development environment
## Need to add a ROS container potentially

services:

  mariadb-prod:
    image: mariadb:latest
    container_name: bloom-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: bloomrootpassword
      MARIADB_DATABASE: bloomdb
      MARIADB_USER: bloomuser
      MARIADB_PASSWORD: bloompassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bloom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  bloom-server:
    build:
      context: .
    image: bloom-server:latest
    container_name: bloom-server
    ports:
      - "5000:8080"
      - "2443:2443"
    depends_on:
      mariadb-prod:
        condition: service_started
        restart: true
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://+:8080
    restart: always
    volumes:
      - dpkeys:/var/dpkeys
    networks:
      - bloom-network

  auto_rsr:
    build:
      context: ./AutoRSR
    image: auto-rsr:latest
    container_name: auto-rsr
    restart: always
    environment:
      - ARSR_PORT=5050
      - ARSR_RECORDINGS_DIR=/app/uploads/recordings
    ports:
      - "5050:5050"
    volumes:
      - rsr_recordings:/app/uploads/recordings
    networks:
      - bloom-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  bloom-network:
    driver: bridge

volumes:
  dpkeys:
  db_data:
  rsr_recordings: